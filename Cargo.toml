[package]
name = "pwqgen-android"
version = "0.1.0"
edition = "2021"
license = "0BSD"
publish = false

[features]
# Leaves out FLAG_SECURE so screenshots can be taken for store listings.
screenshots = []

[lib]
name = "pwqgen"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
getrandom = "0.3"
zeroize = "1.9.1"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "android-native-activity", "default_fonts"] }
jni = "0.21"
ndk-context = "0.1.1"
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
